name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:architecture
      - run: npm test
      - run: npm run build
  postgres-updater:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: board_test
          POSTGRES_USER: board
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U board -d board_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BOARD_TEST_DATABASE_URL: postgresql+psycopg://board:test-only@127.0.0.1:5432/board_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock -r requirements-runtime.lock
      - run: python -m unittest discover -s tests -p test_update_board.py -v
