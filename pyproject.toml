[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiten-board"
version = "0.2.0"
description = "Archive importer and local board application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "Pillow>=13,<14",
]

[project.optional-dependencies]
dev = ["httpx2>=2.13,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "kaiten_backup*", "kaiten_viewer*"]

